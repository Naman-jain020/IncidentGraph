services:

  postgres:
    image: postgres:16-alpine
    container_name: incidentgraph-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: incidentgraph
      POSTGRES_USER: incidentgraph
      POSTGRES_PASSWORD: incidentgraph

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U incidentgraph -d incidentgraph"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: incidentgraph-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://incidentgraph:incidentgraph@postgres:5432/incidentgraph

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: incidentgraph-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: